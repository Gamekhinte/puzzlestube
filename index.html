<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#E8D8C3" />
    <meta name="description" content="Puzzlestube von screame: Puzzles ohne Werbung, mit eigenen Fotos und 3D-Puzzles." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Puzzlestube" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon-48.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Puzzlestube</title>
    <style>
      html, body { margin: 0; height: 100%; background: #E8D8C3; }
      #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #2B2118; }
      #start img { width: 140px; height: 140px; border-radius: 32px; box-shadow: 0 6px 18px rgba(50,30,10,0.25); animation: schrei 1.6s ease-in-out infinite; }
      #start b { font-size: 34px; letter-spacing: -0.02em; }
      #start span { font-size: 20px; color: #5C4A3A; }
      @keyframes schrei { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { #start img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="start">
        <img src="logo.jpg" alt="Puzzlestube Logo" />
        <b>Puzzlestube</b>
        <span>von screame</span>
        <button id="neu" hidden style="margin-top:18px;min-height:56px;padding:0 26px;border-radius:12px;border:0;background:#25584D;color:#fff;font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">Neu laden</button>
      </div>
    </div>
    <script>
      // Fehleranzeige: Stürzt etwas ab, steht die Meldung auf dem Bildschirm statt einer leeren Seite.
      (function () {
        var shown = false;
        function zeige(msg) {
          try {
            var box = document.getElementById('fehler');
            if (!box) {
              box = document.createElement('div');
              box.id = 'fehler';
              box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#fffdf8;color:#2B2118;border:2px solid #A8432F;border-radius:10px;padding:14px 16px;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25)';
              box.innerHTML = '<b style="font-size:19px">Da ist etwas schiefgelaufen.</b><div id="fehlertext" style="margin:8px 0;font:13px Menlo,Consolas,monospace;word-break:break-word;color:#5C4A3A"></div>' +
                '<button id="fehlerneu" style="min-height:48px;padding:0 20px;border-radius:10px;border:0;background:#25584D;color:#fff;font:600 18px -apple-system,Arial,sans-serif">Neu laden</button>';
              document.body.appendChild(box);
              document.getElementById('fehlerneu').onclick = function () { location.reload(); };
            }
            var t = document.getElementById('fehlertext');
            if (t.textContent.length < 600) t.textContent += (t.textContent ? ' | ' : '') + msg + ' (' + navigator.userAgent.replace(/^.*?\((.*?)\).*$/, '$1') + ')';
            shown = true;
          } catch (e) {}
        }
        window.__zeigeFehler = zeige;
        window.addEventListener('error', function (e) { zeige(String(e.message || e.error || 'Fehler') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '')); });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; zeige('Promise: ' + String((r && (r.message || r)) || 'unbekannt')); });
      })();
      // Notbremse: Startet die App nicht, Knopf zeigen, der den alten Offline-Speicher leert und neu lädt.
      setTimeout(function () {
        var b = document.getElementById('neu');
        if (!b) return;
        b.hidden = false;
        b.onclick = function () {
          var done = function () { location.reload(); };
          var jobs = [];
          if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(done, done);
        };
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
